<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Soya Haven — Orders</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px; background: #f7f2ea; color: #2b241f; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #6b6055; font-size: 13px; margin-bottom: 20px; }
  .token-row { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type="password"], input[type="text"] { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; flex: 1; max-width: 320px; }
  button { padding: 8px 14px; border: none; border-radius: 4px; background: #57654f; color: white; font-size: 13px; cursor: pointer; }
  button:hover { background: #454f40; }
  .counts { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .count-card { background: white; border: 1px solid #e5e0d5; border-radius: 6px; padding: 10px 16px; }
  .count-card .n { font-size: 22px; font-weight: 600; }
  .count-card .l { font-size: 11px; text-transform: uppercase; color: #6b6055; letter-spacing: 0.05em; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #efe7d9; font-size: 13px; }
  th { background: #efe7d9; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #6b6055; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; text-transform: uppercase; }
  .status-completed { background: #dfe7db; color: #454f40; }
  .status-started { background: #f0e6d8; color: #8a6d23; }
  .status-abandoned, .status-expired { background: #f3e0d5; color: #a05a2c; }
  #error { color: #b91c1c; font-size: 13px; margin-bottom: 12px; }
  #empty { color: #6b6055; font-size: 13px; padding: 20px; text-align: center; }
  h2 { font-size: 15px; margin: 32px 0 10px; }
  .flow-tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; text-transform: uppercase; background: #e8e1f0; color: #5b4a70; }
  .integ-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .integ-pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12px; background: white; border: 1px solid #e5e0d5; }
  .integ-dot { width: 8px; height: 8px; border-radius: 50%; }
  .integ-dot.on { background: #4a7a4a; }
  .integ-dot.off { background: #c0392b; }
  #testMetaResult { margin-top: 10px; padding: 10px 12px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-word; display: none; }
  #testMetaResult.ok { display: block; background: #dfe7db; color: #2f3d2b; }
  #testMetaResult.fail { display: block; background: #f6dede; color: #7a2a20; }
</style>
</head>
<body>
  <h1>Soya Haven Co. — Orders</h1>
  <p class="sub">Read-only view of checkout activity. Not for editing/fulfillment workflows.</p>

  <div class="token-row">
    <input type="password" id="token" placeholder="Admin token" />
    <button onclick="saveTokenAndLoad()">Load</button>
  </div>

  <div id="error"></div>

  <h2 style="margin-top:0;">Integrations</h2>
  <div class="integ-row" id="integRow"></div>
  <button id="testMetaBtn" onclick="testMeta()" style="margin-bottom: 8px;">Send a real test event to Meta</button>
  <div id="testMetaResult"></div>

  <h2>Page views</h2>
  <div class="counts" id="viewCounts"></div>
  <div id="viewsWrap"></div>

  <h2>Orders</h2>
  <div class="counts" id="counts"></div>
  <div id="tableWrap"></div>

  <h2>Automated emails sent</h2>
  <p class="sub">Abandoned checkout, welcome, post-purchase, and winback — most recent 100 sends.</p>
  <div id="automationWrap"></div>

  <script>
    const tokenInput = document.getElementById("token");
    const stored = localStorage.getItem("soyaHavenAdminToken");
    if (stored) tokenInput.value = stored;

    function saveTokenAndLoad() {
      localStorage.setItem("soyaHavenAdminToken", tokenInput.value);
      load();
    }

    async function load() {
      const token = tokenInput.value.trim();
      const errorEl = document.getElementById("error");
      const countsEl = document.getElementById("counts");
      const tableWrap = document.getElementById("tableWrap");
      errorEl.textContent = "";
      countsEl.innerHTML = "";
      tableWrap.innerHTML = "";

      if (!token) return;

      await loadIntegrationStatus(token);
      await loadPageViews(token);

      try {
        const res = await fetch("/api/admin/orders", {
          headers: { Authorization: "Bearer " + token },
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || "Failed to load.";
          await loadAutomationSends(token);
          return;
        }

        countsEl.innerHTML =
          data.counts
            .map(function (c) {
              return (
                '<div class="count-card"><div class="n">' +
                c.count +
                '</div><div class="l">' +
                c.status +
                "</div></div>"
              );
            })
            .join("") +
          '<div class="count-card"><div class="n">' +
          data.subscriberCount +
          '</div><div class="l">subscribers</div></div>';

        if (data.sessions.length === 0) {
          tableWrap.innerHTML = '<div id="empty">No checkout activity yet.</div>';
          await loadAutomationSends(token);
          return;
        }

        const rows = data.sessions
          .map(function (s) {
            const items = s.cart
              .map(function (i) {
                return i.scent + " (" + i.size + ") x" + i.quantity;
              })
              .join(", ");
            return (
              "<tr><td>" +
              new Date(s.created_at + "Z").toLocaleString() +
              "</td><td>" +
              s.email +
              "</td><td>" +
              items +
              "</td><td>$" +
              s.total_amount.toFixed(2) +
              '</td><td><span class="status status-' +
              s.status +
              '">' +
              s.status +
              "</span></td></tr>"
            );
          })
          .join("");

        tableWrap.innerHTML =
          "<table><thead><tr><th>Date</th><th>Email</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>" +
          rows +
          "</tbody></table>";
      } catch (err) {
        errorEl.textContent = "Couldn't reach the server: " + err.message;
      }

      await loadAutomationSends(token);
    }

    async function loadAutomationSends(token) {
      const wrap = document.getElementById("automationWrap");
      wrap.innerHTML = "";
      try {
        const res = await fetch("/api/admin/automation-sends", {
          headers: { Authorization: "Bearer " + token },
        });
        const data = await res.json();
        if (!res.ok) return;

        if (data.sends.length === 0) {
          wrap.innerHTML = '<div id="empty">No automated emails sent yet.</div>';
          return;
        }

        const rows = data.sends
          .map(function (s) {
            return (
              "<tr><td>" +
              new Date(s.sent_at + "Z").toLocaleString() +
              '</td><td><span class="flow-tag">' +
              s.flow.replace("_", " ") +
              "</span></td><td>Email " +
              s.step +
              "</td><td>" +
              s.email +
              "</td></tr>"
            );
          })
          .join("");

        wrap.innerHTML =
          "<table><thead><tr><th>Sent</th><th>Flow</th><th>Step</th><th>Email</th></tr></thead><tbody>" +
          rows +
          "</tbody></table>";
      } catch (err) {
        // Non-fatal — the orders table above already surfaced connection errors.
      }
    }

    async function loadPageViews(token) {
      const countsEl = document.getElementById("viewCounts");
      const wrap = document.getElementById("viewsWrap");
      countsEl.innerHTML = "";
      wrap.innerHTML = "";
      try {
        const res = await fetch("/api/admin/page-views", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) return;
        const data = await res.json();

        countsEl.innerHTML =
          '<div class="count-card"><div class="n">' +
          data.total +
          '</div><div class="l">total views</div></div>' +
          '<div class="count-card"><div class="n">' +
          data.last7Days +
          '</div><div class="l">last 7 days</div></div>';

        if (data.byDay.length === 0) {
          wrap.innerHTML = '<div id="empty">No page views recorded yet.</div>';
          return;
        }

        const rows = data.byDay
          .map(function (d) {
            return "<tr><td>" + d.day + "</td><td>" + d.count + "</td></tr>";
          })
          .join("");

        wrap.innerHTML =
          "<table><thead><tr><th>Day</th><th>Views</th></tr></thead><tbody>" + rows + "</tbody></table>";
      } catch (err) {
        // Non-fatal.
      }
    }

    async function loadIntegrationStatus(token) {
      const row = document.getElementById("integRow");
      row.innerHTML = "";
      try {
        const res = await fetch("/api/admin/integration-status", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) return;
        const data = await res.json();
        const labels = {
          stripe: "Stripe",
          stripeWebhook: "Stripe Webhook",
          klaviyo: "Klaviyo",
          resend: "Resend",
          meta: "Meta",
        };
        row.innerHTML = Object.keys(labels)
          .map(function (key) {
            const on = data[key];
            return (
              '<div class="integ-pill"><span class="integ-dot ' +
              (on ? "on" : "off") +
              '"></span>' +
              labels[key] +
              (on ? " configured" : " not set") +
              "</div>"
            );
          })
          .join("");
      } catch (err) {
        // Non-fatal.
      }
    }

    async function testMeta() {
      const token = tokenInput.value.trim();
      const resultEl = document.getElementById("testMetaResult");
      if (!token) return;
      resultEl.className = "";
      resultEl.textContent = "Sending...";
      resultEl.style.display = "block";
      try {
        const res = await fetch("/api/admin/test-meta", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
        });
        const data = await res.json();
        if (data.ok) {
          resultEl.className = "ok";
          resultEl.textContent = "Success! Meta accepted the event:\n" + JSON.stringify(data.result, null, 2);
        } else {
          resultEl.className = "fail";
          resultEl.textContent = "Failed (" + data.reason + "):\n" + data.message;
        }
      } catch (err) {
        resultEl.className = "fail";
        resultEl.textContent = "Couldn't reach the server: " + err.message;
      }
    }

    if (stored) load();
  </script>
</body>
</html>
